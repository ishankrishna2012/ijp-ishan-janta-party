name: Natural Random Contribution Bot

on:
  schedule:
    # Triggers 3 times a day at 06:00, 14:00, and 22:00 UTC
    - cron: '0 6,14,22 * * *'
  workflow_dispatch: # Allows you to manually trigger it via the Actions tab

jobs:
  make-contribution:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Generate Random Commits
      run: |
        # Generates a random number between 1 and 4
        NUM_COMMITS=$(( ( RANDOM % 4 ) + 1 ))
        echo "Will perform $NUM_COMMITS commits in this cycle."
        
        # Configure Git credentials
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        # Loop to create and commit files multiple times
        for i in $(seq 1 $NUM_COMMITS)
        do
          echo "Activity on: $(date) - commit $i" >> contribution.txt
          git add contribution.txt
          git commit -m "docs: code documentation update #$RANDOM [skip ci]"
        done
        
        # Push all random commits at once back to master
        git push origin master
