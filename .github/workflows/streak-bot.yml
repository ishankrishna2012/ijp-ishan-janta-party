name: Automated Contribution Streak

on:
  push:
    branches:
      - main
      - master
  schedule:
    # This triggers the bot automatically every day at 12:00 PM UTC
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows you to manually trigger it with a button click

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Update Contribution File
        run: |
          echo "Automated daily entry logged on: $(date)" >> contribution.txt

      - name: Commit and Push to Master
        run: |
          git config --global user.name "ishankrishna2012"
          git config --global user.email "contactishankrishna@gmail.com"
          git add contribution.txt
          git commit -m "Automated daily contribution update [skip ci]" || echo "No changes to commit"
          git push
