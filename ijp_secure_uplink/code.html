<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Secure Uplink - IJP Directorate</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#056e00",
                        "on-secondary-fixed-variant": "#035300",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f9f9f9",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#6d3a00",
                        "on-primary-container": "#693800",
                        "on-secondary-fixed": "#012200",
                        "surface-container-highest": "#e2e2e2",
                        "on-background": "#1a1c1c",
                        "surface-tint": "#8f4e00",
                        "surface-container-high": "#e8e8e8",
                        "inverse-surface": "#2f3131",
                        "tertiary-fixed": "#e2e2e2",
                        "secondary-fixed-dim": "#72de5c",
                        "primary-fixed": "#ffdcc2",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#2e1500",
                        "background": "#f9f9f9",
                        "on-tertiary-container": "#444444",
                        "surface-container": "#eeeeee",
                        "surface-container-low": "#f3f3f4",
                        "on-surface": "#1a1c1c",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#b2b2b2",
                        "surface-variant": "#e2e2e2",
                        "surface-dim": "#dadada",
                        "secondary-container": "#8dfc75",
                        "on-surface-variant": "#554336",
                        "outline-variant": "#dbc2b0",
                        "on-secondary-container": "#067500",
                        "on-tertiary-fixed": "#1b1b1b",
                        "primary-fixed-dim": "#ffb77a",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "primary": "#8f4e00",
                        "inverse-primary": "#ffb77a",
                        "secondary-fixed": "#8dfc75",
                        "on-tertiary-fixed-variant": "#474747",
                        "tertiary": "#5e5e5e",
                        "surface-bright": "#f9f9f9",
                        "primary-container": "#ff9933",
                        "inverse-on-surface": "#f0f1f1",
                        "outline": "#887364"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "margin-desktop": "64px",
                        "margin-mobile": "16px",
                        "container-max": "1280px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "display-lg": ["Anton"],
                        "label-bold": ["Inter"],
                        "mono-style": ["Inter"],
                        "headline-lg-mobile": ["Anton"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-xl": ["Anton"],
                        "headline-lg": ["Anton"]
                    },
                    "fontSize": {
                        "display-lg": ["96px", { "lineHeight": "100%", "letterSpacing": "0.02em", "fontWeight": "400" }],
                        "label-bold": ["14px", { "lineHeight": "120%", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "mono-style": ["12px", { "lineHeight": "120%", "letterSpacing": "0.1em", "fontWeight": "500" }],
                        "headline-lg-mobile": ["36px", { "lineHeight": "110%", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "150%", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "160%", "fontWeight": "400" }],
                        "headline-xl": ["64px", { "lineHeight": "110%", "fontWeight": "400" }],
                        "headline-lg": ["48px", { "lineHeight": "110%", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .scanline-bg {
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 0, 0, 0.05) 51%
            );
            background-size: 100% 4px;
            animation: panBg 10s linear infinite;
        }
        @keyframes panBg {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }
        .progress-bar-anim {
            animation: loadingBar 4s ease-in-out infinite;
        }
        @keyframes loadingBar {
            0% { width: 0%; }
            50% { width: 100%; }
            100% { width: 0%; float: right; }
        }
        .glitch-text:hover {
            animation: glitch 0.2s cubic-bezier(.25, .46, .45, .94) both infinite;
            color: #ba1a1a;
        }
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col relative overflow-hidden font-body-md text-body-md selection:bg-primary selection:text-on-primary">
<!-- Ambient Texture & Scanlines -->
<div class="absolute inset-0 scanline-bg pointer-events-none z-0 opacity-50"></div>
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_transparent_0%,_rgba(0,0,0,0.1)_100%)] pointer-events-none z-0"></div>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative z-10">
<!-- Login Card / Dossier -->
<div class="w-full max-w-md relative">
<!-- Dossier Tab -->
<div class="absolute -top-10 left-4 bg-surface-container-lowest border-2 border-b-0 border-on-surface px-6 py-2 shadow-[4px_0px_0px_0px_rgba(0,0,0,1)] rounded-t-none z-0">
<span class="font-mono-style text-mono-style uppercase text-on-surface tracking-widest">FORM-84-B</span>
</div>
<!-- Main Panel -->
<div class="bg-surface-container-lowest border-2 border-on-surface shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] p-8 md:p-12 relative z-10 rounded-none">
<!-- Serial Number -->
<div class="absolute top-4 right-4 text-right">
<span class="font-mono-style text-mono-style text-tertiary uppercase block">AUTH. LEVEL 9</span>
<span class="font-mono-style text-mono-style text-primary uppercase block animate-pulse">CONNECTION SECURE</span>
</div>
<!-- Header -->
<div class="mb-10 mt-6 border-b-2 border-on-surface pb-6">
<div class="flex items-center gap-2 mb-2 text-on-surface">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">terminal</span>
<span class="font-mono-style text-mono-style uppercase tracking-widest">IJP Directorate Hub</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface uppercase leading-none">
                        Secure<br/>Uplink
                    </h1>
</div>
<!-- Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Input: Operative ID -->
<div class="space-y-2 relative">
<label class="block font-label-bold text-label-bold uppercase text-on-surface" for="operative_id">Operative ID</label>
<div class="relative">
<input class="w-full bg-surface border-2 border-on-surface p-4 font-mono-style text-mono-style text-on-surface placeholder-tertiary-fixed-dim outline-none focus:border-secondary focus:ring-0 rounded-none transition-colors" id="operative_id" name="operative_id" placeholder="ENTER 12-DIGIT CODE" required="" type="text"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-tertiary-fixed-dim">badge</span>
</div>
</div>
<!-- Input: Authorization Key -->
<div class="space-y-2 relative">
<label class="block font-label-bold text-label-bold uppercase text-on-surface" for="auth_key">Authorization Key</label>
<div class="relative">
<input class="w-full bg-surface border-2 border-on-surface p-4 font-mono-style text-mono-style text-on-surface placeholder-tertiary-fixed-dim outline-none focus:border-secondary focus:ring-0 rounded-none transition-colors" id="auth_key" name="auth_key" placeholder="••••••••••••" required="" type="password"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-tertiary-fixed-dim">key</span>
</div>
</div>
<!-- Action Area -->
<div class="pt-6">
<button class="w-full bg-primary text-on-primary border-2 border-on-surface py-5 px-6 font-label-bold text-label-bold uppercase tracking-widest shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:translate-x-[4px] active:translate-y-[4px] active:shadow-none transition-all rounded-none flex items-center justify-center gap-3" type="button">
                            Authenticate
                            <span class="material-symbols-outlined">login</span>
</button>
</div>
<!-- Auxiliary Links -->
<div class="text-center pt-4">
<a class="inline-block font-mono-style text-mono-style text-on-surface-variant hover:text-error uppercase border-b border-transparent hover:border-error transition-colors glitch-text" href="#">
                            Forgot ID? Contact the Ministry of Memory
                        </a>
</div>
</form>
<!-- Stamp Decoration -->
<div class="absolute -bottom-6 -right-6 transform rotate-[-15deg] opacity-80 pointer-events-none">
<div class="border-4 border-error text-error p-2 rounded-none bg-surface-container-lowest">
<span class="font-headline-lg-mobile text-headline-lg-mobile uppercase block leading-none border-2 border-error p-2">CLASSIFIED</span>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom Status Bar -->
<div class="w-full bg-on-surface border-t-2 border-on-surface h-12 flex items-center relative z-20 overflow-hidden">
<div class="flex-shrink-0 px-4 flex items-center gap-2 border-r-2 border-surface h-full bg-primary text-on-primary">
<span class="material-symbols-outlined animate-spin" style="font-size: 18px;">radar</span>
<span class="font-mono-style text-mono-style uppercase font-bold tracking-widest">SYSTEM STATUS</span>
</div>
<div class="flex-grow h-full bg-surface-container-highest relative">
<div class="absolute top-0 left-0 h-full bg-secondary progress-bar-anim"></div>
<div class="absolute inset-0 flex items-center px-4 mix-blend-difference text-on-primary">
<span class="font-mono-style text-mono-style uppercase tracking-[0.2em] animate-pulse">Scanning for dissent...</span>
</div>
</div>
</div>
</body></html>
